<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Avengers Character Search</h1>
    </header>

    <main>
      <form id="search-form">
        <label for="search-input"> Search by Full Name or Alias </label>

        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="e.g. Captain America"
          />

          <button type="submit" id="search-button">Search</button>
        </div>
      </form>

      <section>
        <h2>Result</h2>
        <hr />
        <div id="result"></div>
      </section>
    </main>
  </body>
</html>
